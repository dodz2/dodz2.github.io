<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demiurge</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #03050a;
        overflow: hidden;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 10px;
        color: #9fe8ff;
        font: 13px/1.4 monospace;
        letter-spacing: 1px;
        pointer-events: none;
      }
      #info-panel {
        position: fixed;
        top: 8px;
        right: 10px;
        width: 240px;
        color: #9fe8ff;
        font: 12px/1.45 monospace;
        background: rgba(3, 5, 10, 0.82);
        border: 1px solid #1c4a58;
        padding: 8px 10px;
        pointer-events: auto;
      }
      #info-panel .empty {
        margin: 0;
        opacity: 0.7;
      }
      #info-panel dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
      }
      #info-panel dt {
        opacity: 0.65;
      }
      #info-panel dd {
        margin: 0;
        text-align: right;
      }
      #time-bar {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        pointer-events: none;
      }
      #time-bar button {
        pointer-events: auto;
        font: 12px/1 monospace;
        color: #9fe8ff;
        background: rgba(3, 5, 10, 0.82);
        border: 1px solid #9fe8ff;
        padding: 6px 10px;
        cursor: pointer;
      }
      #time-bar button.active {
        background: #9fe8ff;
        color: #03050a;
      }
      #tool-bar {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        pointer-events: none;
      }
      #tool-bar button {
        pointer-events: auto;
        font: 12px/1 monospace;
        color: #9fe8ff;
        background: rgba(3, 5, 10, 0.82);
        border: 1px solid #9fe8ff;
        padding: 6px 10px;
        cursor: pointer;
      }
      #tool-bar button.active {
        background: #9fe8ff;
        color: #03050a;
      }
      #tooltip {
        position: fixed;
        left: 0;
        top: 0;
        color: #9fe8ff;
        font: 12px/1.3 monospace;
        background: rgba(3, 5, 10, 0.9);
        border: 1px solid #1c4a58;
        padding: 3px 7px;
        pointer-events: none;
        white-space: nowrap;
      }
      #edit-panel {
        position: fixed;
        bottom: 12px;
        right: 10px;
        width: 240px;
        color: #9fe8ff;
        font: 12px/1.45 monospace;
        background: rgba(3, 5, 10, 0.82);
        border: 1px solid #1c4a58;
        padding: 8px 10px;
        pointer-events: auto;
      }
      #edit-panel[hidden] {
        display: none;
      }
      #edit-panel dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 8px;
        align-items: center;
      }
      #edit-panel dt {
        opacity: 0.65;
      }
      #edit-panel dd {
        margin: 0;
        text-align: right;
      }
      #edit-panel input[type='range'],
      #edit-panel select {
        grid-column: 1 / -1;
        width: 100%;
        box-sizing: border-box;
        pointer-events: auto;
      }
      #edit-panel .edit-actions {
        margin-top: 8px;
        text-align: right;
      }
      #edit-panel button {
        font: 12px/1 monospace;
        color: #9fe8ff;
        background: rgba(3, 5, 10, 0.82);
        border: 1px solid #9fe8ff;
        padding: 5px 10px;
        cursor: pointer;
        pointer-events: auto;
      }
      #edit-panel button:hover {
        background: #9fe8ff;
        color: #03050a;
      }
    </style>
    <script type="module" crossorigin src="/demiurge/assets/index-DYFWsgfS.js"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <aside id="info-panel"><p class="empty">Aucune sélection</p></aside>
    <div id="edit-panel" hidden></div>
    <div id="tool-bar">
      <button type="button" data-preset="navigate">Nav</button>
      <button type="button" data-preset="star">Etoile</button>
      <button type="button" data-preset="planet">Planete</button>
      <button type="button" data-preset="asteroid">Asteroide</button>
    </div>
    <div id="time-bar">
      <button type="button" data-scale="0">Pause</button>
      <button type="button" data-scale="1">×1</button>
      <button type="button" data-scale="10">×10</button>
      <button type="button" data-scale="100">×100</button>
    </div>
    <div id="tooltip" hidden></div>
  </body>
</html>
